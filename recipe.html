<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https://oroyhudjptfzuhvmjypm.supabase.co; connect-src 'self' https://oroyhudjptfzuhvmjypm.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Oppskrift | MatPreppern</title>
    <meta name="description" content="Se ingredienser, næringsinnhold og fremgangsmåte for en MatPreppern-oppskrift." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Hopp til hovedinnhold</a>
    <header class="site-header">
      <nav class="navbar" aria-label="Hovedmeny">
        <a href="index.html" class="logo" aria-label="MatPreppern, forsiden">MatPreppern</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primaryNav" aria-label="Åpne meny" data-nav-toggle>
          <span class="nav-toggle-lines" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <div class="nav-links" id="primaryNav" data-nav-menu>
          <a href="index.html#recipes" aria-current="page">Oppskrifter</a>
          <a href="planner.html">Planlegger</a>
          <a href="community-notes.html">Community Notes</a>
          <a href="add-recipe.html">Legg til oppskrift</a>
          <a href="account.html" data-auth-label>Logg inn</a>
        </div>
      </nav>
    </header>

    <main id="main-content">
      <p id="recipePageStatus" class="data-status" role="status" aria-live="polite">Henter oppskriften …</p>
      <div id="recipePageContent" aria-busy="true"><h1>Oppskrift</h1></div>
    </main>

    <footer class="site-footer"><div><p><strong>MatPreppern</strong></p><nav aria-label="Juridisk informasjon"><a href="legal.html#privacy">Personvern</a><a href="legal.html#terms">Vilkår</a><a href="legal.html#contact">Kontakt</a></nav></div></footer>

    <dialog id="reportDialog" class="native-dialog" aria-labelledby="reportDialogTitle">
      <form id="reportForm" method="dialog" class="dialog-card">
        <div class="dialog-heading">
          <h2 id="reportDialogTitle">Rapporter oppskrift</h2>
          <button id="closeReportDialog" class="close-modal" type="button" aria-label="Lukk rapportskjema">×</button>
        </div>
        <label>
          Årsak
          <select id="reportReason" required>
            <option value="spam">Spam eller reklame</option>
            <option value="stotende">Støtende innhold</option>
            <option value="feil">Alvorlig feilinformasjon</option>
            <option value="annet">Annet</option>
          </select>
        </label>
        <label>
          Tilleggsinformasjon (valgfritt)
          <textarea id="reportDetails" maxlength="1000"></textarea>
        </label>
        <button class="primary-button" type="submit">Send rapport</button>
        <p id="reportMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </dialog>

    <script type="module" src="js/auth-nav.js"></script>
    <script type="module" src="js/pwa.js"></script>
    <script type="module" src="js/recipe-page.js"></script>
  </body>
</html>
